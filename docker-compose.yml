version: "3.8"

services:

  # PostgreSQL + PGVector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dsp_postgres
    environment:
      POSTGRES_DB: document_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama — local LLM provider
  ollama:
    image: ollama/ollama:latest
    container_name: dsp_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Arize Phoenix — full UI tracing & observability
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: dsp_phoenix
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC
    environment:
      - PHOENIX_WORKING_DIR=/phoenix
    volumes:
      - phoenix_data:/phoenix

  # FastAPI backend
  api:
    build: .
    container_name: dsp_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - POSTGRES_HOST=postgres
      - PHOENIX_HOST=phoenix
      - PHOENIX_GRPC_PORT=4317
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      phoenix:
        condition: service_started
    volumes:
      - ./prompts:/app/prompts
      - ./data:/app/data
    restart: on-failure

  # OpenWebUI — chat frontend
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: dsp_openwebui
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_BASE_URL=http://api:8000/api/v1
      - OPENAI_API_KEY=dummy
      - WEBUI_AUTH=false
    depends_on:
      - api
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  postgres_data:
  ollama_data:
  phoenix_data:
  openwebui_data:
