version: "3.8"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: dsp_postgres
    environment:
      POSTGRES_DB: document_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: dsp_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: dsp_phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      - PHOENIX_WORKING_DIR=/phoenix
    volumes:
      - phoenix_data:/phoenix

  # Container 1: RAG API (LlamaIndex ecosystem)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dsp_api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=document_search
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PHOENIX_HOST=phoenix
      - PHOENIX_GRPC_PORT=4317
      - DATA_DIR=./data
      - PROMPTS_DIR=./prompts
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      phoenix:
        condition: service_started
    volumes:
      - ./prompts:/app/prompts
      - ./data:/app/data
    restart: on-failure

  # Container 2: CrewAI Agent (CrewAI ecosystem)
  crewai-agent:
    build:
      context: .
      dockerfile: Dockerfile.crewai
    container_name: dsp_crewai
    ports:
      - "8001:8001"
    environment:
      - RAG_API_URL=http://api:8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      - api
      - ollama
    restart: on-failure

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: dsp_openwebui
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_BASE_URL=http://crewai-agent:8001/api/v1
      - OPENAI_API_KEY=dummy
      - WEBUI_AUTH=false
    depends_on:
      - crewai-agent
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  postgres_data:
  ollama_data:
  phoenix_data:
  openwebui_data:
